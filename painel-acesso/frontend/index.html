<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Acesso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="tela-login" class="container">
    <h1>Painel de Acesso</h1>
    <form id="form-login">
      <input type="text" id="usuario" placeholder="Usuário" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="erro-login" class="erro"></p>
  </div>

  <div id="tela-painel" class="container escondido">
    <h1>Painel de Acesso</h1>
    <p class="usuario-logado">Logado como: <span id="nome-usuario"></span></p>

    <form id="form-registro">
      <input type="text" id="texto" placeholder="Novo registro..." required>
      <button type="submit">Adicionar</button>
    </form>

    <div id="lista"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
